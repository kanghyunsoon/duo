<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><rect width="1280" height="780" fill="#f6f7f9"/><text x="248" y="52" font-size="22" font-weight="700" fill="#1f2328">Review</text><text x="248" y="76" font-size="12.5" font-weight="400" fill="#6b7280">Deterministic review of the current diff. Running it does not write a Review Record.</text><text x="248" y="106" font-size="12" font-weight="400" fill="#6b7280">From</text><rect x="248" y="112" width="140" height="30" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="258" y="132" font-size="12" font-weight="400" fill="#9aa1ab">HEAD</text><text x="404" y="106" font-size="12" font-weight="400" fill="#6b7280">To</text><rect x="404" y="112" width="140" height="30" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="414" y="132" font-size="12" font-weight="400" fill="#9aa1ab">(working tree)</text><text x="560" y="106" font-size="12" font-weight="400" fill="#6b7280">Task (optional)</text><rect x="560" y="112" width="300" height="30" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="570" y="132" font-size="12" font-weight="400" fill="#9aa1ab">AUTH-03 refresh</text><rect x="876" y="119" width="16" height="16" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="900" y="132" font-size="12.5" font-weight="400" fill="#1f2328">Use semantic assistance</text><rect x="1068" y="112" width="127.60000000000001" height="30" rx="5" fill="#2f6feb" stroke="#2f6feb" stroke-width="1"/><text x="1131.8" y="132" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Review changes</text><rect x="248" y="160" width="1000" height="34" rx="5" fill="#fff8e6" stroke="#e3b341" stroke-width="1"/><rect x="260" y="167" width="114" height="20" rx="10" fill="#fff" stroke="#b35900" stroke-width="1"/><text x="317" y="181" font-size="11" font-weight="700" fill="#b35900" text-anchor="middle">index-required</text><text x="388" y="182" font-size="12.5" font-weight="400" fill="#b35900">shown instead of a verdict when the index is not current: run duoctl index, then review again</text><text x="248" y="232" font-size="17" font-weight="700" fill="#1f2328">Deterministic review:</text><rect x="438" y="216" width="51" height="20" rx="10" fill="#fff" stroke="#cf222e" stroke-width="1"/><text x="463.5" y="230" font-size="11" font-weight="700" fill="#cf222e" text-anchor="middle">BLOCK</text><text x="508" y="232" font-size="12.5" font-weight="400" fill="#6b7280">basis: forbidden-import claim C-3 · baseline present</text><rect x="248" y="250" width="1000" height="300" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><rect x="248" y="250" width="1000" height="32" rx="6" fill="#e9ecf0" stroke="#c9ced6" stroke-width="1"/><text x="258" y="271" font-size="12.5" font-weight="700" fill="#1f2328">Alignment</text><text x="378" y="271" font-size="12.5" font-weight="700" fill="#1f2328">Rule</text><text x="578" y="271" font-size="12.5" font-weight="700" fill="#1f2328">Subject</text><text x="778" y="271" font-size="12.5" font-weight="700" fill="#1f2328">Reason</text><text x="1048" y="271" font-size="12.5" font-weight="700" fill="#1f2328">Provenance</text><text x="1168" y="271" font-size="12.5" font-weight="700" fill="#1f2328">Evidence</text><line x1="248" y1="346" x2="1248" y2="346" stroke="#e9ecf0" stroke-width="1"/><rect x="258" y="304" width="72" height="20" rx="10" fill="#fff" stroke="#cf222e" stroke-width="1"/><text x="294" y="318" font-size="11" font-weight="700" fill="#cf222e" text-anchor="middle">CONFLICT</text><text x="378" y="318" font-size="12.5" font-weight="400" fill="#1f2328">forbidden-import</text><text x="578" y="318" font-size="12.5" font-weight="400" fill="#1f2328">D-006 current authority</text><text x="778" y="318" font-size="12.5" font-weight="400" fill="#1f2328">src/ui/page.ts imports legacy-db</text><text x="1048" y="318" font-size="12.5" font-weight="400" fill="#1f2328">introduced</text><text x="1168" y="318" font-size="12.5" font-weight="400" fill="#2f6feb">2 item(s)</text><line x1="248" y1="410" x2="1248" y2="410" stroke="#e9ecf0" stroke-width="1"/><rect x="258" y="368" width="65" height="20" rx="10" fill="#fff" stroke="#b35900" stroke-width="1"/><text x="290.5" y="382" font-size="11" font-weight="700" fill="#b35900" text-anchor="middle">PARTIAL</text><text x="378" y="382" font-size="12.5" font-weight="400" fill="#1f2328">test-coverage</text><text x="578" y="382" font-size="12.5" font-weight="400" fill="#1f2328">AUTH-03</text><text x="778" y="382" font-size="12.5" font-weight="400" fill="#1f2328">no related test changed</text><text x="1048" y="382" font-size="12.5" font-weight="400" fill="#1f2328">—</text><text x="1168" y="382" font-size="12.5" font-weight="400" fill="#2f6feb">1 item(s)</text><line x1="248" y1="474" x2="1248" y2="474" stroke="#e9ecf0" stroke-width="1"/><rect x="258" y="432" width="65" height="20" rx="10" fill="#fff" stroke="#1a7f37" stroke-width="1"/><text x="290.5" y="446" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">ALIGNED</text><text x="378" y="446" font-size="12.5" font-weight="400" fill="#1f2328">decision-governance</text><text x="578" y="446" font-size="12.5" font-weight="400" fill="#1f2328">D-004</text><text x="778" y="446" font-size="12.5" font-weight="400" fill="#1f2328">change stays inside governed paths</text><text x="1048" y="446" font-size="12.5" font-weight="400" fill="#1f2328">—</text><text x="1168" y="446" font-size="12.5" font-weight="400" fill="#2f6feb">1 item(s)</text><line x1="248" y1="538" x2="1248" y2="538" stroke="#e9ecf0" stroke-width="1"/><rect x="258" y="496" width="65" height="20" rx="10" fill="#fff" stroke="#0969da" stroke-width="1"/><text x="290.5" y="510" font-size="11" font-weight="700" fill="#0969da" text-anchor="middle">UNKNOWN</text><text x="378" y="510" font-size="12.5" font-weight="400" fill="#1f2328">requirement-implementation</text><text x="578" y="510" font-size="12.5" font-weight="400" fill="#1f2328">AUTH-05 (informational)</text><text x="778" y="510" font-size="12.5" font-weight="400" fill="#1f2328">another milestone</text><text x="1048" y="510" font-size="12.5" font-weight="400" fill="#1f2328">—</text><text x="1168" y="510" font-size="12.5" font-weight="400" fill="#2f6feb">1 item(s)</text><rect x="248" y="570" width="1000" height="90" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1" stroke-dasharray="6 4"/><text x="264" y="596" font-size="13" font-weight="700" fill="#1f2328">Semantic supplement (optional, separate from the verdict)</text><rect x="264" y="610" width="65" height="20" rx="10" fill="#fff" stroke="#1a7f37" stroke-width="1"/><text x="296.5" y="624" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">success</text><text x="348" y="625" font-size="12.5" font-weight="400" fill="#6b7280">LLM claims are listed here and never change the deterministic verdict.</text><text x="248" y="690" font-size="12.5" font-weight="400" fill="#6b7280">Limitations: e.g. reviewed-side-context-from-working-tree, imports-unresolved</text><circle cx="1260" cy="104" r="12" fill="#e8590c" stroke="#e8590c" stroke-width="1.5"/><text x="1260" y="108.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="1260" cy="176" r="12" fill="#e8590c" stroke="#e8590c" stroke-width="1.5"/><text x="1260" y="180.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="1260" cy="226" r="12" fill="#e8590c" stroke="#e8590c" stroke-width="1.5"/><text x="1260" y="230.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="1260" cy="262" r="12" fill="#e8590c" stroke="#e8590c" stroke-width="1.5"/><text x="1260" y="266.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="1260" cy="582" r="12" fill="#e8590c" stroke="#e8590c" stroke-width="1.5"/><text x="1260" y="586.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="0" y="0" width="220" height="780" rx="0" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="16" y="34" font-size="16" font-weight="700" fill="#1f2328">DUO</text><text x="58" y="34" font-size="11" font-weight="400" fill="#6b7280">Project Direction Console</text><text x="20" y="74" font-size="13" font-weight="400" fill="#1f2328">Overview</text><text x="20" y="106" font-size="13" font-weight="400" fill="#1f2328">Direction</text><text x="20" y="138" font-size="13" font-weight="400" fill="#1f2328">Pending decisions</text><text x="20" y="170" font-size="13" font-weight="400" fill="#1f2328">Work map</text><text x="20" y="202" font-size="13" font-weight="400" fill="#1f2328">Graph</text><text x="20" y="234" font-size="13" font-weight="400" fill="#1f2328">Analysis coverage</text><text x="20" y="266" font-size="13" font-weight="400" fill="#1f2328">Context</text><rect x="10" y="280" width="200" height="26" rx="4" fill="#2f6feb" stroke="#2f6feb" stroke-width="1"/><text x="20" y="298" font-size="13" font-weight="700" fill="#fff">Review</text><text x="20" y="330" font-size="13" font-weight="400" fill="#1f2328">Review history</text><text x="20" y="362" font-size="13" font-weight="400" fill="#1f2328">Search</text><text x="16" y="398" font-size="11" font-weight="400" fill="#6b7280">Local only.</text><text x="16" y="414" font-size="11" font-weight="400" fill="#6b7280">Truth changes need a human</text><text x="16" y="430" font-size="11" font-weight="400" fill="#6b7280">Decision action.</text></svg>
