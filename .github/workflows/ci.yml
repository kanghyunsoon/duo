name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 package.json packageManager에서 읽는다.
      - uses: pnpm/action-setup@v6
      # ADR-001: CI 기준 런타임은 Node 24(최신 24.x, patch 고정 없음).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check boundaries (manifests, tsconfig references)
        run: pnpm check:boundaries
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Pinned playwright-core installs its matching browser for real UI E2E on every OS.
      - name: install headless Chromium for UI E2E
        run: pnpm exec playwright-core install chromium
      - name: install Chromium system libraries
        if: runner.os == 'Linux'
        run: pnpm exec playwright-core install-deps chromium
      # AC-005-01: the official grammar WASM files load into web-tree-sitter and parse on this OS.
      - name: tree-sitter grammar smoke test
        run: pnpm test:grammars
      - run: pnpm test
      - name: benchmark correctness smoke (small fixture, JSON contract)
        run: pnpm benchmark:smoke
      - name: validate docs traceability
        run: pnpm docs:validate
      - name: smoke test built CLI
        run: node apps/cli/dist/main.js --version
      # T17.1: npm pack is the artifact oracle; clean global and project-local installs outside the workspace.
      - name: distribution E2E (packed @duo-director/cli)
        run: pnpm test:dist
      # TASK-020: CLI/MCP/install journeys and RC-only checks against the installed release candidate; C209 init repetitions.
      - name: release conformance (installed release candidate)
        run: pnpm test:conformance
        env:
          DUO_C209_RUNS: "6"
